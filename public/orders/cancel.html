<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout cancelled — DialTone</title>
  <meta name="description" content="Your checkout was cancelled. No payment was processed." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg?v=20260427" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --navy: #06234B;
      --gold: #E8A020;
      --cream: #FAF7F2;
      --text: #1A1A2E;
      --muted: #6B7280;
      --line: rgba(6, 35, 75, 0.12);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', 'Segoe UI', -apple-system, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--cream);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .logo {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--navy);
      text-decoration: none;
      margin-bottom: 2.5rem;
      letter-spacing: -0.01em;
    }

    .logo span { color: var(--gold); }

    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 1px 2px rgba(6, 35, 75, 0.04);
    }

    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: rgba(6, 35, 75, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy);
      font-size: 28px;
      font-weight: 400;
      line-height: 1;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--navy);
      margin: 0 0 0.75rem;
      letter-spacing: -0.01em;
    }

    .lede {
      color: var(--muted);
      margin: 0 0 1.5rem;
    }

    .footer-note {
      font-size: 0.9rem;
      color: var(--text);
      margin: 0;
    }
  </style>
</head>
<body>
  <a href="/" class="logo">Dial<span>Tone</span></a>

  <main class="card">
    <div class="icon" aria-hidden="true">&times;</div>
    <h1>Checkout cancelled</h1>
    <p class="lede">No payment was processed.</p>
    <p class="footer-note">If you'd still like to place this order, please contact the restaurant directly.</p>
  </main>
</body>
</html>
