<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment received — DialTone</title>
  <meta name="description" content="Your order is in the queue. You'll get an SMS when it's being prepared." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg?v=20260427" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --navy: #06234B;
      --gold: #E8A020;
      --green: #1f8a4d;
      --cream: #FAF7F2;
      --text: #1A1A2E;
      --muted: #6B7280;
      --line: rgba(6, 35, 75, 0.12);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', 'Segoe UI', -apple-system, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--cream);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .logo {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--navy);
      text-decoration: none;
      margin-bottom: 2.5rem;
      letter-spacing: -0.01em;
    }

    .logo span { color: var(--gold); }

    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 1px 2px rgba(6, 35, 75, 0.04);
    }

    .check {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--navy);
      margin: 0 0 0.75rem;
      letter-spacing: -0.01em;
    }

    .lede {
      color: var(--muted);
      margin: 0 0 1.5rem;
    }

    .next {
      text-align: left;
      background: #faf6ec;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin: 0 0 1.5rem;
    }

    .next-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--gold);
      font-weight: 700;
      margin: 0 0 0.5rem;
    }

    .next ul {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.95rem;
    }

    .next li {
      padding: 0.25rem 0;
      color: var(--text);
    }

    .footer-note {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0;
    }
  </style>
</head>
<body>
  <a href="/" class="logo">Dial<span>Tone</span></a>

  <main class="card">
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Payment received</h1>
    <p class="lede">Thanks &mdash; your order is in the queue.</p>

    <div class="next">
      <p class="next-title">What happens next</p>
      <ul>
        <li>You'll get an SMS when your order is being prepared.</li>
        <li>Another when it's ready for pickup.</li>
      </ul>
    </div>

    <p class="footer-note">If you have questions, contact the restaurant directly.</p>
  </main>
</body>
</html>
